name: Build Windows Package & Installer

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 Installer & Portable Package
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Standalone Windows CLI Executable
        run: |
          pyinstaller --noconfirm --onefile --windowed=false --name "burmese-music-cleaner-cli" main.py

      - name: Install Node.js dependencies & Build Web GUI
        run: |
          npm install
          npm run build

      - name: Download Windows Audio Binaries (fpcalc & ffmpeg)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin

          # 1. Download fpcalc (Chromaprint)
          Write-Host "Downloading Chromaprint fpcalc..."
          $fpcalcUrl = "https://github.com/acoustid/chromaprint/releases/download/v1.5.1/chromaprint-fpcalc-1.5.1-windows-x86_64.zip"
          Invoke-WebRequest -Uri $fpcalcUrl -OutFile fpcalc.zip
          Expand-Archive -Path fpcalc.zip -DestinationPath fpcalc_extracted -Force
          Get-ChildItem -Path fpcalc_extracted -Recurse -Filter "fpcalc.exe" | Copy-Item -Destination "bin\fpcalc.exe" -Force
          Remove-Item -Recurse -Force fpcalc.zip, fpcalc_extracted

          # 2. Download ffmpeg
          Write-Host "Downloading FFmpeg..."
          $ffmpegUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $ffmpegUrl -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_extracted -Force
          Get-ChildItem -Path ffmpeg_extracted -Recurse -Filter "ffmpeg.exe" | Copy-Item -Destination "bin\ffmpeg.exe" -Force
          Remove-Item -Recurse -Force ffmpeg.zip, ffmpeg_extracted

          # 3. Copy built CLI to bin
          Copy-Item -Path "dist\burmese-music-cleaner-cli.exe" -Destination "bin\burmese-music-cleaner-cli.exe" -Force

          Get-ChildItem -Path bin

      - name: Assemble Windows Staging Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package-windows
          New-Item -ItemType Directory -Force -Path package-windows\bin

          # Copy binaries
          Copy-Item -Path "bin\*" -Destination "package-windows\bin" -Recurse -Force

          # Copy built web application
          Copy-Item -Path "dist" -Destination "package-windows\dist" -Recurse -Force
          Copy-Item -Path "package.json" -Destination "package-windows\package.json" -Force
          Copy-Item -Path "requirements.txt" -Destination "package-windows\requirements.txt" -Force
          Copy-Item -Path "main.py" -Destination "package-windows\main.py" -Force
          Copy-Item -Path "music_cleaner" -Destination "package-windows\music_cleaner" -Recurse -Force
          Copy-Item -Path "windows\Launch-WebGUI.bat" -Destination "package-windows\Launch-WebGUI.bat" -Force
          Copy-Item -Path "start.bat" -Destination "package-windows\start.bat" -Force
          Copy-Item -Path "README.md" -Destination "package-windows\README.md" -Force
          Copy-Item -Path ".env.example" -Destination "package-windows\env.example.txt" -Force

          # Copy node_modules for local production runtime
          npm prune --production
          Copy-Item -Path "node_modules" -Destination "package-windows\node_modules" -Recurse -Force

          Write-Host "Windows package assembled successfully."

      - name: Compile Inno Setup Windows Installer (.exe)
        shell: pwsh
        run: |
          # Check for Inno Setup compiler
          $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $isccPath)) {
            Write-Host "Inno Setup not found in default path, installing via Chocolatey..."
            choco install innosetup --no-progress -y
          }
          New-Item -ItemType Directory -Force -Path dist-installer
          & $isccPath windows\installer.iss
          Get-ChildItem -Path dist-installer

      - name: Create Portable Zip Package
        shell: pwsh
        run: |
          Compress-Archive -Path "package-windows\*" -DestinationPath "dist-installer\BurmeseMusicCleaner-Windows-Portable-x64.zip" -Force
          Get-ChildItem -Path dist-installer

      - name: Upload Windows Packages as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Burmese-Music-Cleaner-Windows-x64
          path: dist-installer/*
          if-no-files-found: error

      - name: Create GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-installer/BurmeseMusicCleaner-Setup-x64.exe
            dist-installer/BurmeseMusicCleaner-Windows-Portable-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
